name: Build HabitLock iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project HabitLock.xcodeproj -scheme HabitLock -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO SYMROOT=build build

      - name: Create Payload Folder for IPA
        run: |
          mkdir -p Payload
          if [ -d "build/Release-iphoneos/HabitLock.app" ]; then
            cp -r build/Release-iphoneos/HabitLock.app Payload/
            zip -r HabitLock.ipa Payload
          elif [ -d "build/HabitLock.xcarchive/Products/Applications" ]; then
            cp -r build/HabitLock.xcarchive/Products/Applications/*.app Payload/
            zip -r HabitLock.ipa Payload
          else
            echo "Directorio de compilación preparado para Xcode Project."
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitLock-iOS-IPA
          path: |
            HabitLock.ipa
            Payload/
          if-no-files-found: ignore
