name: Diagnostic & Unsigned iOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Diagnostic (iphoneos)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Print Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: List Available SDKs
        run: xcodebuild -showsdks

      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          else
            echo "XcodeGen is already installed."
          fi

      - name: Generate Xcode Project with XcodeGen
        run: xcodegen generate

      - name: Verify HabitLock.xcodeproj existence
        run: |
          if [ -d "HabitLock.xcodeproj" ]; then
            echo "HabitLock.xcodeproj successfully generated."
          else
            echo "Error: HabitLock.xcodeproj was not generated."
            exit 1
          fi

      - name: List Xcode Project Targets and Schemes
        run: xcodebuild -list -project HabitLock.xcodeproj

      - name: Build HabitLock Target for iphoneos (Unsigned)
        run: |
          xcodebuild -project HabitLock.xcodeproj \
            -target HabitLock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SYMROOT=build \
            build

      - name: Verify Output App Bundle Existence
        run: |
          if [ -d "build/Release-iphoneos/HabitLock.app" ]; then
            echo "Build Succeeded: build/Release-iphoneos/HabitLock.app exists."
          else
            echo "Error: build/Release-iphoneos/HabitLock.app does not exist."
            exit 1
          fi

      - name: Package Diagnostic Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/HabitLock.app Payload/
          zip -r HabitLock-unsigned.ipa Payload

      - name: Upload Unsigned Diagnostic IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitLock-unsigned-ipa
          path: HabitLock-unsigned.ipa
          if-no-files-found: error
